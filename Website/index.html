<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Oceanun</title>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="./img/image.png" alt="Logo Oceanun">
            <span>Oceanun</span>
        </a>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="#">Cruzeiros</a></li>
            <li><a href="#">Pacotes</a></li>
        </ul>
        <div class="nav-actions">
            <form class="search" role="search">
                <input type="text" placeholder="Pesquisar" id="searchInput">
                <button type="submit" aria-label="Pesquisar">
                    <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
                </button>
            </form>
            <a href="#" class="icon" aria-label="Carrinho">
                <svg viewBox="0 0 24 24" class="fill"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM1 2h3.3l.9 2H22l-3.6 9H7.2l-.9 2H19v2H3l2.3-4.5L3 4H1z"/></svg>
            </a>
            <a href="#" class="icon" aria-label="Minha conta">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.5" class="fill"/><path d="M5.5 19c1.5-3 4-4 6.5-4s5 1 6.5 4" class="fill"/></svg>
            </a>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h1>Sua próxima aventura <span>começa aqui</span></h1>

            <form class="booking">
                <div class="trip-types">
                    <button type="button" class="chip active">Ida e volta</button>
                    <button type="button" class="chip">Só ida</button>
                    <button type="button" class="chip">Vários destinos</button>
                    <span class="divider"></span>
                    <button type="button" class="chip">Voo + hotel</button>
                </div>
                <div class="fields">
                    <div class="field route">
                        <input type="text" placeholder="Origem" id="origem">
                        <button type="button" class="swap" id="swap" aria-label="Inverter origem e destino">⇄</button>
                        <input type="text" placeholder="Destino" id="destino">
                    </div>
                    <div class="field dates">
                        <label><span>Ida</span><input type="date"></label>
                        <label class="volta"><span>Volta</span><input type="date"></label>
                    </div>
                    <label class="field travelers">
                        <small>Viajantes</small>
                        <input type="number" min="1" value="1">
                    </label>
                    <button type="submit" class="btn-buscar">Buscar</button>
                </div>
            </form>

            <div class="cta">
                <a href="#" class="btn btn-solid">Solicite seu orçamento</a>
                <a href="#" class="btn btn-outline">Conheça a Oceanun</a>
            </div>
        </section>
    </main>

    <button class="chat">CHAT</button>

    <footer>
        <p>&copy; 2026 Oceanun. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
