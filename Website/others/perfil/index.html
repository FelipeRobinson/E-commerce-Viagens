<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oceanun - Perfil do Usuário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="../../img/image.png">
</head>
<body>
    <nav>
        <a href="../../index.html" class="logo">
            <img src="../../img/image.png" alt="Logo Oceanun">
            <span>Oceanun</span>
        </a>
        <ul class="menu">
            <li><a href="../../index.html">Início</a></li>
            <li><a href="../cruzeiros/index.html">Cruzeiros</a></li>
            <li><a href="../pacotes/index.html">Pacotes</a></li>
        </ul>
        <div class="acoes">
            <form class="pesquisa" role="search">
                <input type="text" placeholder="Pesquisar">
                <button type="submit" aria-label="Pesquisar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
            <a href="../carrinho/index.html" class="icone" aria-label="Carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
            <a href="index.html" class="icone" aria-label="Minha conta">
                <i class="fa-solid fa-circle-user"></i>
            </a>
        </div>
    </nav>
    <nav class="secondary-nav">
        <ul class="secondary-links">
            <li><a href="index.html" class="active">Perfil</a></li>
            <li><a href="viagens/index.html">Viagens</a></li>
            <li><a href="ajuda/index.html">Central de ajuda</a></li>
        </ul>
    </nav>

    <main class="profile-container">
        <div class="profile-avatar">
            <i class="fa-solid fa-user"></i>
        </div>

        <section id="perfil-dados" hidden>
            <div class="profile-info">
                <div class="info-column col-1">
                    <div class="data-group">
                        <span class="label">Nome do Usuário:</span>
                        <span class="value" id="ver-nome"></span>
                    </div>
                    <div class="data-group">
                        <span class="label">CPF:</span>
                        <span class="value" id="ver-cpf"></span>
                    </div>
                    <div class="data-group">
                        <span class="label">Data de nascimento:</span>
                        <span class="value" id="ver-nascimento"></span>
                    </div>
                </div>
                <div class="info-column col-2">
                    <div class="data-group">
                        <span class="label">E-mail:</span>
                        <span class="value" id="ver-email"></span>
                    </div>
                    <div class="data-group">
                        <span class="label">Número:</span>
                        <span class="value" id="ver-telefone"></span>
                    </div>
                </div>
            </div>
            <div class="perfil-botoes">
                <button type="button" class="perfil-btn" id="perfil-editar">Editar perfil</button>
                <button type="button" class="perfil-btn secundario" id="perfil-sair">Sair</button>
                <button type="button" class="perfil-btn perigo" id="perfil-excluir">Excluir perfil</button>
            </div>
        </section>

        <form id="login-form" class="form-perfil" novalidate hidden>
            <h1>Entrar</h1>
            <label for="login-email">E-mail ou usuário</label>
            <input id="login-email" name="email" type="text" autocomplete="username">

            <label for="login-senha">Senha</label>
            <input id="login-senha" name="senha" type="password" autocomplete="current-password">

            <p class="erro" id="erro-login" role="alert"></p>
            <div class="perfil-botoes">
                <button type="submit" class="perfil-btn" id="login-entrar">Entrar</button>
            </div>
            <p class="troca-acesso">Não tem conta? <button type="button" id="ir-cadastro">Cadastre-se</button></p>
        </form>

        <form id="perfil-form" class="form-perfil" novalidate hidden>
            <h1 id="perfil-titulo"></h1>
            <p class="troca-acesso" id="perfil-aviso">Já tem conta? <button type="button" id="ir-login">Entrar</button></p>
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" type="text" autocomplete="name" aria-describedby="erro-nome">
            <p class="erro" id="erro-nome"></p>

            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" aria-describedby="erro-cpf">
            <p class="erro" id="erro-cpf"></p>

            <label for="nascimento">Data de nascimento</label>
            <input id="nascimento" name="nascimento" type="date" autocomplete="bday" aria-describedby="erro-nascimento">
            <p class="erro" id="erro-nascimento"></p>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" aria-describedby="erro-email">
            <p class="erro" id="erro-email"></p>

            <label for="telefone">Telefone com DDD</label>
            <input id="telefone" name="telefone" type="tel" autocomplete="tel-national" placeholder="(19) 99999-9999" aria-describedby="erro-telefone">
            <p class="erro" id="erro-telefone"></p>

            <div id="campos-senha">
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" autocomplete="new-password" aria-describedby="erro-senha">
                <p class="erro" id="erro-senha"></p>

                <label for="confirmar">Confirmar senha</label>
                <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" aria-describedby="erro-confirmar">
                <p class="erro" id="erro-confirmar"></p>
            </div>

            <p class="erro" id="erro-geral" role="alert"></p>
            <div class="perfil-botoes">
                <button type="submit" class="perfil-btn" id="perfil-salvar"></button>
                <button type="button" class="perfil-btn secundario" id="perfil-cancelar">Cancelar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Oceanun. Todos os direitos reservados.</p>
    </footer>
    <button id="chat" aria-label="ChatBot"><i class="fa-solid fa-comments"></i></button>

    <script src="../../js/pacotes-db.js"></script>
    <script src="../../js/catalogo.js"></script>
    <script src="./script.js"></script>
</body>
</html>
