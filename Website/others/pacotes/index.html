<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart-style.css">
    <link rel="icon" href="../../img/image.png">
    <title>Oceanun - Pacotes</title>
</head>
<body>
    <nav>
        <a href="../../index.html" class="logo">
            <img src="../../img/image.png" alt="Logo Oceanun">
            <span>Oceanun</span>
        </a>
        <ul class="menu">
            <li><a href="../../index.html">Início</a></li>
            <li><a href="../cruzeiros/index.html">Cruzeiros</a></li>
            <li><a href="index.html" style="color: var(--amarelo);">Pacotes</a></li>
        </ul>
        <div class="acoes">
            <form class="pesquisa" role="search">
                <input type="text" placeholder="Pesquisar">
                <button type="submit" aria-label="Pesquisar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
            <a href="../carrinho/index.html" class="icone" aria-label="Carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
            <a href="../perfil/index.html" class="icone" aria-label="Minha conta">
                <i class="fa-solid fa-circle-user"></i>
            </a>
        </div>
    </nav>

    <main class="pacotes-page">
        <section class="header-section">
            <h1>Nossos <span class="highlight">Pacotes</span></h1>
            <p>Experiências exclusivas e imperdíveis para quem busca o melhor do luxo e aventura.</p>
        </section>

        <div class="catalogo">
            <aside>
                <form id="filtros" class="filtros">
                    <label>Buscar <input type="search" name="q" placeholder="Navio, destino, serviço..."></label>
                    <label>Destino <select name="destino"><option value="">Todos os destinos</option></select></label>
                    <label>Serviço <select name="servico"><option value="">Qualquer serviço</option></select></label>
                    <label>Ida a partir de <input type="date" name="inicio"></label>
                    <label>Pessoas <input type="number" name="pessoas" min="1" placeholder="1"></label>
                    <label>Até R$ <input type="number" name="max" min="0" step="100" placeholder="sem limite"></label>
                    <label class="check"><input type="checkbox" name="destaque" value="1"> Só imperdíveis</label>
                    <button type="reset" class="btn branco">Limpar filtros</button>
                </form>
            </aside>
            <section class="resultados">
                <p id="contagem" class="contagem"></p>
                <div id="cards"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Oceanun. Todos os direitos reservados.</p>
    </footer>
    <button id="chat" aria-label="ChatBot"><i class="fa-solid fa-comments"></i></button>

    <script src="../../js/pacotes-db.js"></script>
    <script src="../../js/catalogo.js"></script>
    <script src="script.js"></script>
</body>
</html>
