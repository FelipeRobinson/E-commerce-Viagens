<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../../img/image.png">
    <title>Oceanun - Carrinho</title>
</head>
<body>
    <nav>
        <a href="../../index.html" class="logo">
            <img src="../../img/image.png" alt="Logo Oceanun">
            <span>Oceanun</span>
        </a>
        <ul class="menu">
            <li><a href="../../index.html">Início</a></li>
            <li><a href="../cruzeiros/index.html">Cruzeiros</a></li>
            <li><a href="../pacotes/index.html">Pacotes</a></li>
        </ul>
        <div class="acoes">
            <form class="pesquisa" role="search">
                <input type="text" placeholder="Pesquisar">
                <button type="submit" aria-label="Pesquisar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
            <a href="index.html" class="icone" aria-label="Carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
            <a href="../perfil/index.html" class="icone" aria-label="Minha conta">
                <i class="fa-solid fa-circle-user"></i>
            </a>
        </div>
    </nav>

    <main class="carrinho-page">
        <section class="header-section">
            <h1>Meu <span class="highlight">Carrinho</span></h1>
            <p>Confira os itens selecionados para sua próxima aventura.</p>
        </section>

        <div class="cart-container">
            <div id="cart-items" class="cart-items">
                <!-- Itens do carrinho serão renderizados aqui -->
                <p class="empty-cart">Seu carrinho está vazio.</p>
            </div>

            <div class="cart-summary">
                <h3>Resumo do Pedido</h3>
                <div class="summary-line">
                    <span>Subtotal:</span>
                    <span id="cart-total">R$ 0,00</span>
                </div>
                <button class="btn amarelo checkout-btn">Finalizar Compra</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Oceanun. Todos os direitos reservados.</p>
    </footer>
    <button id="chat" aria-label="ChatBot"><i class="fa-solid fa-comments"></i></button>

    <script src="script.js"></script>
</body>
</html>
